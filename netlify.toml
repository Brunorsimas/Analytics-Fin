[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Playwright é usado só nos testes locais; não baixar navegador no build.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Dado financeiro do usuário vive no navegador. Estes cabeçalhos reduzem a
# superfície para quem tentar embutir ou espionar a página.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"
